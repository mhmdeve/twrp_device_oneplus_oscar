name: Building TWRP Android-14.1

on:
  workflow_dispatch:
  watch:
    types: [started]

env:
  MANIFEST: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
  DEVICE: oscar
  DT_LINK: https://github.com/mhmdeve/twrp_device_oneplus_oscar -b Stable_V2
  DT_PATH: device/oneplus/oscar
  CHAT_ID: ${{ secrets.TEST_CHAT_ID }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  TARGET: bootimage
  ZIP_NAME: TWRP_OSCAR_A14.1-ALPAHA.zip
  TZ: Asia/Islamabad

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
       - name: Checkout
         uses: actions/checkout@master
         
       - name: Initializing environment
         run: |
            docker rmi `docker images -q`
            sudo apt-get purge -y libreoffice* rhythmbox* shotwell* sane-utils libsane* printer-driver-brlaser printer-driver-foo2zjs printer-driver-m2300w printer-driver-ptouch printer-driver-splix || true 
            git config --global user.name "spector0"
            git config --global user.email "www.ranjith007.ra@gmail.com"         
            sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* mysql* php*  || true 
            sudo -E apt-get clean 
            sudo -E apt-get -qq update
            sudo -E apt-get -qq install bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev repo rsync flex curl  bison aria2
            sudo -E apt-get -qq update && sudo -E apt-get -qq install bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev rsync flex bison aria2
            sudo curl --create-dirs -L -o /usr/local/bin/repo -O -L https://storage.googleapis.com/git-repo-downloads/repo
            sudo chmod a+rx /usr/local/bin/repo
            
       - name: Sync TWRP A14.1 source and device tree and pick some gerrit patches
         run: |
             mkdir work
             cd work
             repo init -u $MANIFEST --depth=1 --partial-clone --clone-filter=blob:limit=10M --groups=all,-notdefault,-device,-darwin,-x86,-mips
             repo sync -j4
             git clone $DT_LINK --depth=1 --single-branch $DT_PATH

       - name: Set Swap Space
         uses: pierotofy/set-swap-space@master
         with:
          swap-size-gb: 12
             
       - name: Building TWRP
         run: |
              cd work
              . build/envsetup.sh
              lunch twrp_$DEVICE-eng 
              repopick 5405 5540 5445
              rm -rf .repo/
              mka $TARGET
             
       - name: Uploading recovery-boot image
         run: |
              cd work/out/target/product/$DEVICE
              sudo zip -r9 $ZIP_NAME boot.img
              curl -F chat_id=$CHAT_ID -F document=@$ZIP_NAME https://api.telegram.org/bot$BOT_TOKEN/sendDocument -F caption="Alpha build"
              curl -sL https://git.io/file-transfer | sh
              ./transfer wet $ZIP_NAME
              ./transfer wet recovery-installer.zip
